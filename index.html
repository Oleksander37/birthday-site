<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Сюрприз для тебе! 💖</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
        flex-direction: column;
    }

    /* Кнопки музики в куті */
    .musicBtn {
        position: fixed;
        top: 20px;
        width: 45px;
        height: 45px;
        background: #fff0f5;
        border: 2px solid #ff6699;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        z-index: 100;
        margin-left: 5px;
    }

    #music1 { right: 80px; }
    #music2 { right: 20px; }

    img, video {
        max-width: 90%;
        max-height: 85vh;
        border-radius: 15px;
        transition: opacity 0.8s ease-in-out, transform 0.3s ease;
        cursor: pointer;
    }

    #firstImage {
        animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.03); }
        100% { transform: scale(1); }
    }

    #firstImage:active {
        transform: scale(0.98);
    }
</style>
</head>
<body>

<button id="music1" class="musicBtn" title="Пісня 1">1</button>
<button id="music2" class="musicBtn" title="Пісня 2">2</button>

<img id="firstImage" src="numaki.png" alt="Натисни на мене">
    
<video id="videoPlayer" width="320" style="display:none; opacity:0;" playsinline>
    <source src="video.mp4" type="video/mp4">
    Ваш браузер не підтримує відео.
</video>

<img id="secondImage" src="hanil.png" alt="Друга картинка" style="display:none; opacity:0;">

<audio id="bgMusic1" loop preload="auto">
  <source src="music1.mp3" type="audio/mpeg">
</audio>

<audio id="bgMusic2" loop preload="auto">
  <source src="music2.mp3" type="audio/mpeg">
</audio>

<script>
const first = document.getElementById("firstImage");
const video = document.getElementById("videoPlayer");
const second = document.getElementById("secondImage");

const music1 = document.getElementById("bgMusic1");
const music2 = document.getElementById("bgMusic2");

const btn1 = document.getElementById("music1");
const btn2 = document.getElementById("music2");

// Функція для запуску певної музики та зупинки іншої
function playMusic(selected) {
    if(selected === 1){
        music2.pause();
        music1.play();
    } else if(selected === 2){
        music1.pause();
        music2.play();
    }
}

// Події на кнопки
btn1.addEventListener("click", (e) => {
    e.stopPropagation();
    if(music1.paused){
        playMusic(1);
    } else {
        music1.pause();
    }
});

btn2.addEventListener("click", (e) => {
    e.stopPropagation();
    if(music2.paused){
        playMusic(2);
    } else {
        music2.pause();
    }
});

// Головна дія при натисканні на ФОТО
first.addEventListener("click", () => {
    music1.play().catch(()=>{});
    music2.play().catch(()=>{});

    first.style.opacity = 0;

    setTimeout(() => {
        first.style.display = "none";

        video.style.display = "block";
        setTimeout(() => {
            video.style.opacity = 1;
            video.play();
        }, 100);
    }, 800);
});

// Коли відео закінчується — показуємо останнє фото
video.addEventListener("ended", () => {
    video.style.opacity = 0;
    setTimeout(() => {
        video.style.display = "none";
        second.style.display = "block";
        setTimeout(() => { 
            second.style.opacity = 1; 
        }, 100);
    }, 800);
});
</script>

</body>
    </html>
